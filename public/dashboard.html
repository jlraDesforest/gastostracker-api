<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastosTracker v1.5</title>
    <!-- Conexión a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Conexión a tus Estilos (CSS) -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4 position-relative">
        
        <!-- Header con Botón de Tema -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">📊 GastosTracker Edge Server</h2>
            <button id="btnTema" class="btn btn-outline-secondary btn-sm">☀️ Modo Claro</button>
        </div>
        
        <!-- Dashboard de Balances -->
        <div class="row mb-4 text-center">
            <div class="col-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-2">
                        <h6 class="card-title text-uppercase text-muted mb-1" style="font-size: 0.75rem;">Hoy</h6>
                        <h5 id="balHoy" class="mb-0 fw-bold">S/ 0.00</h5>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-2">
                        <h6 class="card-title text-uppercase text-muted mb-1" style="font-size: 0.75rem;">Semana</h6>
                        <h5 id="balSemana" class="mb-0 fw-bold">S/ 0.00</h5>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-2">
                        <h6 class="card-title text-uppercase text-muted mb-1" style="font-size: 0.75rem;">Mes</h6>
                        <h5 id="balMes" class="mb-0 fw-bold">S/ 0.00</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario Principal -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <form id="formGasto" class="row g-2">
                    <div class="col-md-3">
                        <select id="concepto" class="form-select form-select-sm" required>
                            <option value="" disabled selected>Categoría...</option>
                            <option value="Comida">Comida</option>
                            <option value="Pasajes">Pasajes</option>
                            <option value="Herramientas">Herramientas</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Ropa/Calzado">Ropa/Calzado</option>
                            <option value="Limpieza">Limpieza</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Educación">Educación</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control form-control-sm" id="descripcion" placeholder="Descripción detallada" required>
                    </div>
                    
                    <div class="col-md-2">
                        <input type="number" step="0.10" class="form-control form-control-sm" id="monto" placeholder="Monto (S/.)" required>
                    </div>
                    <div class="col-md-3">
                        <select id="tipo" class="form-select form-select-sm">
                            <option value="Egreso">Egreso</option>
                            <option value="Ingreso">Ingreso</option>
                        </select>
                    </div>
                    
                    <div class="col-md-3">
                        <input type="date" class="form-control form-control-sm" id="fecha" required>
                    </div>
                    <div class="col-md-2">
                        <input type="time" class="form-control form-control-sm" id="hora" required>
                    </div>
                    <div class="col-md-3">
                        <select id="metodo" class="form-select form-select-sm">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Yape">Yape</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Tarjeta">Tarjeta</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="file" class="form-control form-control-sm" id="archivo" accept=".png,.pdf">
                        <small class="text-danger fw-bold d-block mt-1" style="font-size: 0.75rem;">* Solo formatos PNG o PDF (Máx. 5 MB)</small>
                    </div>

                    <div class="col-12 mt-3 text-end">
                        <button type="submit" class="btn btn-success px-4">Guardar Registro</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Botón de refresco manual -->
        <button class="btn btn-info text-white w-100 mb-3 fw-bold" onclick="cargarGastos()">🔄 Actualizar Tabla Manualmente</button>

        <!-- Tabla de Registros -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle shadow-sm">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Categoría & Detalle</th>
                        <th>Método/Voucher</th>
                        <th>Monto</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
        </div>
    </div>

    <!-- Conexión a tu Lógica (JS) -->
    <script src="js/app.js"></script>
</body>
</html>
